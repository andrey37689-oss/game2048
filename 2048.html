<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#bbada0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>2048</title>
<style>
  body { font-family: Arial, sans-serif; background: #faf8ef; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; touch-action: none; user-select: none; }
  h1 { color: #776e65; margin: 0 0 10px; }
  #score { font-size: 24px; color: #776e65; margin-bottom: 15px; }
  #board { display: grid; grid-template-columns: repeat(4, 90px); grid-template-rows: repeat(4, 90px); gap: 10px; background: #bbada0; padding: 10px; border-radius: 8px; }
  .cell { background: #cdc1b4; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #776e65; }
  #message { margin-top: 15px; font-size: 22px; color: #776e65; font-weight: bold; min-height: 28px; }
  button { margin-top: 10px; padding: 8px 20px; font-size: 16px; background: #8f7a66; color: white; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<h1>2048</h1>
<div id="score">Счёт: 0</div>
<div id="board"></div>
<div id="message"></div>
<div style="margin-top:10px; display:grid; grid-template-columns:repeat(3,50px); gap:6px; justify-content:center;">
  <span></span><button onclick="move('up')">⬆</button><span></span>
  <button onclick="move('left')">⬅</button><button onclick="move('down')">⬇</button><button onclick="move('right')">➡</button>
</div>
<button onclick="init()">Новая игра</button>
<script>
const COLORS = {
  2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',
  128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'
};
let board, score;
function init() {
  board = Array.from({length:4},()=>Array(4).fill(0));
  score = 0;
  document.getElementById('message').textContent = '';
  addTile(); addTile(); render();
}
function addTile() {
  let empty = [];
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!board[r][c]) empty.push([r,c]);
  if (!empty.length) return;
  let [r,c] = empty[Math.floor(Math.random()*empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}
function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    let v = board[r][c];
    let d = document.createElement('div');
    d.className = 'cell';
    d.textContent = v || '';
    if (v) { d.style.background = COLORS[v] || '#3c3a32'; if (v >= 128) d.style.fontSize = '24px'; if (v >= 8) d.style.color = '#f9f6f2'; }
    el.appendChild(d);
  }
  document.getElementById('score').textContent = 'Счёт: ' + score;
  if (board.flat().includes(2048)) document.getElementById('message').textContent = '🎉 Ты выиграл!';
  else if (isGameOver()) document.getElementById('message').textContent = '😞 Игра окончена!';
}
function slide(row) {
  let arr = row.filter(v => v);
  for (let i=0;i<arr.length-1;i++) if (arr[i]===arr[i+1]) { arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); }
  while (arr.length<4) arr.push(0);
  return arr;
}
function move(dir) {
  let old = JSON.stringify(board);
  for (let i=0;i<4;i++) {
    let line;
    if (dir==='left') line = board[i];
    else if (dir==='right') line = [...board[i]].reverse();
    else if (dir==='up') line = board.map(r=>r[i]);
    else line = board.map(r=>r[i]).reverse();
    line = slide(line);
    if (dir==='right' || dir==='down') line.reverse();
    if (dir==='left' || dir==='right') board[i] = line;
    else for (let r=0;r<4;r++) board[r][i] = line[r];
  }
  if (JSON.stringify(board) !== old) { addTile(); render(); }
}
function isGameOver() {
  if (board.flat().includes(0)) return false;
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    if (c<3 && board[r][c]===board[r][c+1]) return false;
    if (r<3 && board[r][c]===board[r+1][c]) return false;
  }
  return true;
}
document.addEventListener('keydown', e => {
  const map = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down'};
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

// Управление мышкой/пальцем: свайп по всему документу
let startX = null, startY = null;
document.addEventListener('pointerdown', e => { startX = e.clientX; startY = e.clientY; });
document.addEventListener('pointerup', e => {
  if (startX === null) return;
  let dx = e.clientX - startX, dy = e.clientY - startY;
  startX = startY = null;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
});

init();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
